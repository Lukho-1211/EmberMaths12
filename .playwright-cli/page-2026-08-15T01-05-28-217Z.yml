        - generic [ref=e58]:
          - generic [ref=e59]:
            - heading "Built around the CAPS classroom rhythm" [level=2] [ref=e60]
            - paragraph [ref=e61]: Ember Maths12 mirrors the way South African Grade 12 Mathematics is taught throughout the academic year, following a structured Term 1 to Term 4 programme. Learners progress through weekday lessons designed to build their understanding step by step, with Saturday week tests providing regular opportunities to assess their progress.
            - paragraph [ref=e62]: Every four-week learning block concludes with a pre-exam, helping learners prepare for formal assessments and identify areas that need improvement. The platform also provides curated learning content and downloadable resources, while keeping teachers and parents informed about each learner's progress and development.
